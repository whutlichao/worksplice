  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      /* the cues are authored in the markup; wrap them into reveal units here —
         cue 1 types in per character, cues 2–3 stagger per word */
      var CUES = [byId("f03-cap-0"), byId("f03-cap-1"), byId("f03-cap-2")];
      var units = [];
      CUES.forEach(function (line, i) {
        var text = line.textContent;
        line.textContent = "";
        var parts = i === 0 ? text.split("") : text.split(" ");
        var list = [];
        parts.forEach(function (part, j) {
          if (i > 0 && j > 0) line.appendChild(document.createTextNode(" "));
          var s = document.createElement("span");
          s.className = "f03-unit";
          s.textContent = part;
          line.appendChild(s);
          list.push(s);
        });
        units.push(list);
      });

      var plate = byId("f03-plate");
      var topbar = byId("f03-topbar");
      var badge = byId("f03-badge");
      var crop = byId("f03-crop");
      var strip = byId("f03-strip");
      var rule = byId("f03-rule");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* — scene 1 · 0.0–5.0 — the real board capture holds the plate; the drawn frame
         settles onto it (short push-in), chrome lands, cue 1 types in bottom-left — */
      tl.fromTo(plate, { opacity: 0, scale: 1.012 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0);
      tl.fromTo(topbar, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.06);
      tl.fromTo(units[0], { opacity: 0 }, { opacity: 1, duration: 0.012, ease: "none", stagger: 0.01 }, 0.7);
      /* the honesty mark — both plates are real captures running demo data */
      tl.fromTo(
        badge,
        { opacity: 0, scale: 0.6, rotation: -14 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.34, ease: "back.out(2.4)" },
        2.9
      );

      /* — scene 2 · 5.0–8.0 — cue 2: the crop bracket steps across the board's five real
         columns with the mono label ticking over it (DOM-scrubbed; the footage never moves) — */
      tl.to(CUES[0], { opacity: 0, y: -14, duration: 0.16, ease: "power2.in" }, 5.06);
      tl.fromTo(
        units[1],
        { x: -26, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.32, ease: "power3.out", stagger: 0.05 },
        5.22
      );
      tl.fromTo(crop, { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 5.28);

      /* the five real board columns, as offsets from the crop's seat (left: 418px):
         column lefts 429 / 615 / 801 / 987 / 1173 -> +11 / +197 / +383 / +569 / +755.
         STEP_T holds four stops, so the tour walks Pool -> In progress -> In review ->
         Done and stops one column short of Closed (the timing is fixed). */
      var COL_X = [11, 197, 383, 569, 755];
      var STEP_T = [5.46, 6.02, 6.58, 7.14];
      STEP_T.forEach(function (t, i) {
        tl.fromTo(
          crop,
          { x: i === 0 ? 0 : COL_X[i - 1] },
          { x: COL_X[i], duration: 0.34, ease: "power3.inOut", immediateRender: false },
          t
        );
        /* the mono label rides the same slot as the box: step i shows row i (Pool at
           the first stop), so the chip never reads ahead of the column under it */
        tl.fromTo(
          strip,
          { y: i === 0 ? 0 : -22 * (i - 1) },
          { y: -22 * i, duration: 0.3, ease: "power3.out", immediateRender: false },
          t
        );
      });
      tl.to(crop, { opacity: 0, scale: 0.985, duration: 0.16, ease: "power2.in" }, 7.84);

      /* — scene 3 · 8.0–15.0 — the frame cuts hard from board to channel (same plate);
         the read rule draws once under it and the conversation holds — */
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 2.6, ease: "power1.inOut" }, 8.45);
      /* cue 3 lands with the storyboard's scene boundary (10.0) — and fully in before it */
      tl.to(units[1], { y: -18, opacity: 0, duration: 0.18, ease: "power2.in", stagger: 0.04 }, 9.30);
      tl.fromTo(
        units[2],
        { x: -26, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.32, ease: "power3.out", stagger: 0.045 },
        9.42
      );

      /* full-span anchor: render length 15s */
      tl.to({}, { duration: 15 }, 0);

      window.__timelines["03-the-room"] = tl;
      tl.seek(0);
    })();
  </script>
