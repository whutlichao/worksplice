  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      var card = byId("f02-card");
      var barB = byId("f02-wbar-b");
      var panel = byId("f02-panel");
      var stamp = byId("f02-stamp");
      var badge = byId("f02-badge");
      var chip = byId("f02-chip");
      var cue1 = byId("f02-cue1");
      var cue2a = byId("f02-cue2a");
      var cue2b = byId("f02-cue2b");

      // the card's mono line is authored in the markup; wrap its characters so it can type in
      var typed = byId("f02-typedline");
      var text = typed.textContent;
      var chars = [];
      typed.textContent = "";
      for (var i = 0; i < text.length; i++) {
        var ch = document.createElement("span");
        ch.className = "f02-ch";
        ch.textContent = text.charAt(i);
        typed.appendChild(ch);
        chars.push(ch);
      }

      var INK = "#141111";
      var STONE = "#c9c7c2";

      var tl = gsap.timeline({ paused: true });

      /* — scene 1 · 0.0–1.6 — the write sweeps on, freezes mid-sweep, turns ink;
         the card re-seats as a HELD card — */
      tl.fromTo(barB, { xPercent: -55 }, { xPercent: -25.6, duration: 1.05, ease: "none" }, 0);
      tl.set(barB, { backgroundColor: INK }, 1.05);
      tl.fromTo(card, { y: 0 }, { y: 7, duration: 0.09, ease: "power2.out", immediateRender: false }, 1.05);
      tl.fromTo(card, { y: 7 }, { y: 0, duration: 0.55, ease: "elastic.out(1, 0.55)", immediateRender: false }, 1.14);
      tl.set(barB, { backgroundColor: STONE }, 1.3);
      tl.fromTo(cue1, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.34);

      /* — scene 2 · 1.6–3.4 — the coral verdict is replaced in place by the ink HELD chip;
         the mono line types in beneath it on the card — */
      tl.set(stamp, { opacity: 0 }, 1.88);
      tl.fromTo(
        badge,
        { opacity: 0, scale: 1.6, rotation: -13, y: -16 },
        { opacity: 1, scale: 1, rotation: -4, y: 0, duration: 0.3, ease: "power3.out" },
        1.88
      );
      tl.fromTo(
        chip,
        { opacity: 0, scale: 1.75, rotation: -10 },
        { opacity: 1, scale: 1, rotation: -4, duration: 0.34, ease: "back.out(2.2)" },
        2.1
      );
      tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.012, ease: "none", stagger: 0.012 }, 2.3);

      /* — scene 3 · 3.4–5.0 — the cream-and-ink what-changed panel slides up under the
         card carrying the mono line; the promise lands; the frame holds still — */
      tl.fromTo(panel, { yPercent: 100 }, { yPercent: 0, duration: 0.42, ease: "power3.out" }, 3.34);
      tl.set(cue1, { opacity: 0 }, 3.55);
      tl.fromTo(cue2a, { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 3.58);
      tl.fromTo(cue2b, { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.32, ease: "power3.out" }, 3.64);

      // full-span anchor so the sub-composition timeline covers the whole slot
      tl.to({}, { duration: 5 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-held-not-lost"] = tl;
      tl.seek(0);
    })();
  </script>
