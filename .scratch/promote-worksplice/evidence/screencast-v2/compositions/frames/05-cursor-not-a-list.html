    #root #f05-notemark {

    /* ——— the caption band: designed in-frame type, one cue at a time ———

    <div id="f05-scrim"></div>

    <div id="f05-seat">
      <div id="f05-line"></div>
      <div id="f05-endL" class="f05-endtick"></div>
      <div id="f05-endR" class="f05-endtick"></div>
      <div id="f05-sweep"></div>
      <div id="f05-tick">
        <span id="f05-ticklabel">read: seq</span>
        <span id="f05-numwin"><span id="f05-numfrom">11</span><span id="f05-numto">12</span></span>

    <div id="f05-note"><span id="f05-notemark"></span>survives a restart</div>

    <div id="f05-capband">
      <div id="f05-bandrule"></div>
      <div id="f05-cap-0" class="f05-capline"></div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      /* the shot's captions — designed in-frame typography (no caption track exists) */
      var CAPTIONS = [
        "What an agent has read survives a restart.",
        "Reading doesn\u2019t advance the cursor.",
        "An ack does \u2014 one durable position."
      ];
      var CUE = [0.6, 3.4, 6.2];

      /* caption lines -> word spans (space text nodes keep the measure) */
      var caps = [];
      CAPTIONS.forEach(function (text, i) {
        var line = byId("f05-cap-" + i);
        var words = [];
        text.split(" ").forEach(function (w, j) {
          if (j) line.appendChild(document.createTextNode(" "));
          var s = document.createElement("span");
          s.className = "f05-capword";
          s.textContent = w;
          line.appendChild(s);
          words.push(s);
        });
        caps.push({ line: line, words: words });
      });

      var seat = byId("f05-seat");
      var sweep = byId("f05-sweep");
      var tick = byId("f05-tick");
      var ack = byId("f05-ack");
      var num42 = byId("f05-numfrom");
      var num43 = byId("f05-numto");
      var note = byId("f05-note");
      var notemark = byId("f05-notemark");
      var honest = byId("f05-honest");

      var tl = gsap.timeline({ paused: true });

      /* — scene 1 · 0.0–3.0 — the real feed holds, dimmed, under the designed layer;
           the read line sweeps down the feed once, stops, and reads seq 42 — */
      tl.fromTo(seat, { y: -820 }, { y: 0, duration: 1.05, ease: "power3.out" }, 0.35);
      tl.fromTo(
        caps[0].words,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.055 },
        CUE[0]
      );
      tl.fromTo(tick, { y: -18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(2.1)" }, 1.32);
      tl.fromTo(honest, { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.62);

      /* — scene 2 · 3.0–6.0 — the line holds; a read head passes along it three times
           while the capture keeps scrolling, and the position does not move — */
      tl.to(caps[0].line, { y: -14, opacity: 0, duration: 0.2, ease: "power2.in" }, 3.12);
      tl.fromTo(
        caps[1].words,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.055 },
        CUE[1]
      );
      [3.42, 4.42, 5.42].forEach(function (t) {
        tl.fromTo(sweep, { x: 0 }, { x: 1640, duration: 1, ease: "none", immediateRender: false }, t);
        tl.fromTo(
          sweep,
          { opacity: 0 },
          { opacity: 0.85, duration: 0.16, ease: "power2.out", immediateRender: false },
          t
        );
        tl.to(sweep, { opacity: 0, duration: 0.22, ease: "power2.in" }, t + 0.78);
      });

      /* — scene 3 · 6.0–9.0 — the ack drops onto the line; the position steps forward
           exactly once and the readout rolls 42 → 43; the durable note lands — */
      tl.to(caps[1].line, { y: -14, opacity: 0, duration: 0.2, ease: "power2.in" }, 5.94);
      tl.fromTo(
        caps[2].words,
        { y: 22, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.055 },
        CUE[2]
      );
      tl.fromTo(
        ack,
        { y: -120, opacity: 0, scale: 1.12 },
        { y: 0, opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.7)", transformOrigin: "50% 100%" },
        6.28
      );
      tl.fromTo(seat, { y: 0 }, { y: 64, duration: 0.22, ease: "power3.in", immediateRender: false }, 6.95);
      tl.fromTo(seat, { y: 64 }, { y: 61, duration: 0.05, ease: "power1.out", immediateRender: false }, 7.17);
      tl.fromTo(seat, { y: 61 }, { y: 64, duration: 0.16, ease: "power1.inOut", immediateRender: false }, 7.23);
      tl.fromTo(num42, { yPercent: 0, opacity: 1 }, { yPercent: 100, opacity: 0, duration: 0.18, ease: "power2.in" }, 7);
      tl.fromTo(num43, { yPercent: -100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 7);
      tl.fromTo(note, { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 7.5);
      tl.fromTo(
        notemark,
        { scale: 1 },
        { scale: 1.6, duration: 0.12, ease: "power2.out", immediateRender: false },
        8.2
      );
      tl.to(notemark, { scale: 1, duration: 0.22, ease: "power2.inOut" }, 8.34);

      /* full-span anchor: render length 9s */
      tl.to({}, { duration: 9 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-cursor-not-a-list"] = tl;
      tl.seek(0);
    })();
  </script>
