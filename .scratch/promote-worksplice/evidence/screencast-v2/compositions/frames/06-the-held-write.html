  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      /* the film's captions — designed in-frame typography, one cue at a time (verbatim) */
      var CAPTIONS = [
        "While she was writing, the room moved.",
        "Her draft was held — not merged, not overwritten.",
        "She re-read, rewrote, and answered what actually happened.",
        "This is her session file — not a UI effect."
      ];
      /* the real session-file excerpt — verbatim, no paraphrase (cut 3, 2026-10-04) */
      var EVIDENCE = [
        "Your reply to channel parser-fix was held because the room changed while you were writing.",
        "What happened: 1 new message(s) arrived in this target (seq 3)",
        "Your held draft was: — I've read parser.js and README.md."
      ];
      var CUE = [0.8, 6.1, 12.12, 17.68];

      /* caption lines -> word spans (space text nodes keep the measure + wrap points) */
      var caps = [];
      CAPTIONS.forEach(function (text, i) {
        var line = byId("f06-cap-" + i);
        var words = [];
        text.split(" ").forEach(function (w, j) {
          if (j) line.appendChild(document.createTextNode(" "));
          var s = document.createElement("span");
          s.className = "f06-capword";
          s.textContent = w;
          line.appendChild(s);
          words.push(s);
        });
        caps.push({ line: line, words: words });
      });

      /* evidence card -> one span per character (layout stays fixed; only opacity moves) */
      var evidence = [];
      EVIDENCE.forEach(function (text, i) {
        var box = byId("f06-ev-" + i);
        var chars = [];
        for (var k = 0; k < text.length; k++) {
          var s = document.createElement("span");
          s.className = "f06-evch";
          s.textContent = text.charAt(k);
          box.appendChild(s);
          chars.push(s);
        }
        evidence.push(chars);
      });

      var dots = document.querySelectorAll("#f06-card .f06-evdot");
      var ticks = [byId("f06-tick-0"), byId("f06-tick-1"), byId("f06-tick-2"), byId("f06-tick-3")];
      var plateframe = byId("f06-plateframe");
      var topbar = byId("f06-topbar");
      var anno = byId("f06-anno");
      var leader = byId("f06-leader");
      var held = byId("f06-held");
      var scrim = byId("f06-scrim");
      var card = byId("f06-card");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* — scene 1 · 0.0–6.0 — the channel plate holds the real footage; cue 1 lands on the
         beat; the held count flickers in beside the plate as the interjection arrives (~4.4s) — */
      tl.fromTo(plateframe, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo(topbar, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo(
        caps[0].words,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 },
        CUE[0]
      );
      tl.fromTo(ticks[0], { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2)", transformOrigin: "50% 50%" }, CUE[0]);

      tl.fromTo(anno, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.22, ease: "power3.out" }, 4.3);
      tl.fromTo(
        leader,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.16, ease: "power2.out", transformOrigin: "0% 50%" },
        4.34
      );
      tl.to([anno, leader], { opacity: 0.3, duration: 0.05 }, 4.56);
      tl.to([anno, leader], { opacity: 1, duration: 0.06 }, 4.63);
      tl.to([anno, leader], { opacity: 0.3, duration: 0.05 }, 4.72);
      tl.to([anno, leader], { opacity: 1, duration: 0.07 }, 4.79);
      tl.set([anno, leader], { opacity: 0 }, 6);

      /* — scene 2 · 6.0–12.0 — hard cut to the pushed-in message column; cue 2 lands as the
         ink HELD stamp hits the writing row (freeze-and-stamp) — */
      tl.to(caps[0].line, { opacity: 0, y: -12, duration: 0.18, ease: "power2.in" }, 5.92);
      tl.fromTo(
        caps[1].words,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 },
        CUE[1]
      );
      tl.fromTo(ticks[1], { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2)", transformOrigin: "50% 50%" }, CUE[1]);
      tl.fromTo(
        held,
        { opacity: 0, scale: 1.8, rotation: -14 },
        { opacity: 1, scale: 0.95, rotation: -3, duration: 0.13, ease: "power3.in", transformOrigin: "50% 50%" },
        6.42
      );
      tl.to(held, { scale: 1, rotation: -4, duration: 0.1, ease: "power2.out" }, 6.55);
      /* the signature freeze is short: ~1.7s of stillness, then the stamp lifts into the
         scrim beat (was 11.7 — a ~5s dead beat reviewers read as a stall) */
      tl.to(held, { opacity: 0, duration: 0.3, ease: "power1.out" }, 8.35);

      /* — scene 3 · 12.0–17.5 — the scrim dims the plate; the evidence card slides up as
         hero; its three verbatim mono lines reveal one by one on cue 3 — */
      tl.to(caps[1].line, { opacity: 0, y: -12, duration: 0.18, ease: "power2.in" }, 11.92);
      tl.fromTo(scrim, { opacity: 0 }, { opacity: 0.88, duration: 0.55, ease: "power2.out" }, 12);
      tl.fromTo(card, { opacity: 0, y: 72 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 12.2);
      tl.fromTo(
        caps[2].words,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 },
        CUE[2]
      );
      tl.fromTo(ticks[2], { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2)", transformOrigin: "50% 50%" }, CUE[2]);
      var LINE_T = [13.0, 14.05, 15.15];
      evidence.forEach(function (chars, i) {
        tl.fromTo(
          dots[i],
          { scale: 0 },
          { scale: 1, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 50%" },
          LINE_T[i] - 0.06
        );
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.009 }, LINE_T[i]);
      });

      /* — scene 4 · 17.5–21.0 — the card lifts and the scrim clears for the real revised
         reply (wide cut, same run); cue 4 lands and the take holds for the read — */
      tl.to(caps[2].line, { opacity: 0, y: -12, duration: 0.18, ease: "power2.in" }, 17.58);
      tl.to(card, { opacity: 0, y: -56, duration: 0.4, ease: "power2.in" }, 17.5);
      tl.to(scrim, { opacity: 0, duration: 0.45, ease: "power2.inOut" }, 17.5);
      tl.fromTo(
        caps[3].words,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 },
        CUE[3]
      );
      tl.fromTo(ticks[3], { scale: 0 }, { scale: 1, duration: 0.22, ease: "back.out(2)", transformOrigin: "50% 50%" }, CUE[3]);

      /* full-span anchor: render length 21s */
      tl.to({}, { duration: 21 }, 0);

      window.__timelines["06-the-held-write"] = tl;
      tl.seek(0);
    })();
  </script>
