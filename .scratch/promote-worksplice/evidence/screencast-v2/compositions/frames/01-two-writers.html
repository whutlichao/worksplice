                '<rect x="' + (7 - col) + '" y="' + row + '" width="1" height="1" fill="#141111"/>'

      byId("f01-avatar-nova").innerHTML = avatarSVG("nova", "#27CCF3"); byId("f01-avatar-quill").innerHTML = avatarSVG("quill", "#FE7DA8");

        rail.appendChild(row);
      });
      LANES.forEach(function (lane, i) {
        var tickets = "";
        for (var k = 0; k < 3; k++) {
          var card = i === 1 && k === 0;
          tickets +=
            '<div class="f01-ticket' + (card ? " f01-ticket-card" : "") + '"' + (card ? ' id="f01-ticket-7"' : "") +
            ' data-layout-allow-overflow><span class="f01-tickbar"></span>' + (card ? '<span id="f01-ticketno">#7</span>' : "") +
            '<span class="f01-ticklines"><span class="f01-tickline"></span><span class="f01-tickline f01-tickline-b"></span></span></div>';

      var room = byId("f01-room");
      var ring = byId("f01-ring");
      var ticket7 = byId("f01-ticket-7");
      var chans = room.querySelectorAll(".f01-chan");
      var cols = room.querySelectorAll(".f01-col");
      var tickets = room.querySelectorAll(".f01-ticket");
      var agents = room.querySelectorAll(".f01-agent");

      var card = byId("f01-card");
      var barA = byId("f01-bar-a");
      /* the region both agents write into: the task title's own line */
      var caretA = byId("f01-caret-a");
      var barB = byId("f01-bar-b");
      var caretB = byId("f01-caret-b");
      var sweep = byId("f01-bar-sweep");
      var band = byId("f01-band");
      var nova = byId("f01-writer-nova");
      var quill = byId("f01-writer-quill");
      var stamp = byId("f01-stamp");
      var cue1 = byId("f01-cue1");
      var cue2 = byId("f01-cue2");
      var cue3 = byId("f01-cue3");
      var cardBits = [
        byId("f01-fieldlabel"),
        byId("f01-rowline"),
        byId("f01-footrule"),
        byId("f01-cardfoot"),
      ];

      var tl = gsap.timeline({ paused: true });

      /* ——— scene 1 · 0.0–2.9 — the room draws itself: channels, a board with cards in
         every column, and the agents sitting in it; cue 1 then cue 2 ——— */
      tl.fromTo(room, { y: -34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power4.out" }, 0.06);
      tl.fromTo(cue1, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.5);
      tl.fromTo(
        chans,
        { opacity: 0, x: -12 },
        { opacity: 1, x: 0, duration: 0.28, ease: "power3.out", stagger: 0.07 },
        0.34
      );
      tl.fromTo(
        cols,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.06 },

      /* the room answers the second cue, and the card under the room's cursor is marked */
      tl.to(cue1, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 1.5);
      tl.fromTo(cue2, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 1.62);

      /* ——— scene 2 · 2.9–3.45 — the camera lands on that one card: the room pushes past
         the lens while the card arrives at the same size and seat ——— */
      function placeRing() {
        /* the ring is measured off the real ticket box so it always frames exactly the
           card the camera lands on, whatever the layout did with the type */
        var r = ticket7.getBoundingClientRect();
        var stage = byId("f01-stage").getBoundingClientRect();
        var k = 1920 / stage.width;
        ring.style.left = (r.left - stage.left) * k - 7 + "px";
        ring.style.top = (r.top - stage.top) * k - 7 + "px";
        ring.style.width = r.width * k + 14 + "px";
        ring.style.height = r.height * k + 14 + "px";
      }
      placeRing(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(placeRing); window.addEventListener("load", placeRing);
      tl.fromTo(
        ring,
        { opacity: 0, scale: 1.14 },
        { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.4)", transformOrigin: "50% 50%" },

      );
      tl.to(ring, { opacity: 0, duration: 0.2, ease: "power2.in" }, 2.72);
      tl.to(room, { scale: 1.12, opacity: 0, duration: 0.46, ease: "power2.in", transformOrigin: "50% 50%" }, 2.9);
      tl.to(cue2, { opacity: 0, y: -14, duration: 0.2, ease: "power2.in" }, 2.9);
      tl.fromTo(
        card,
        { scale: 1.12, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.46, ease: "power3.out", transformOrigin: "50% 50%" },
        3.0
      );
      tl.fromTo(
        cardBits,
        { opacity: 0, y: 9 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.06 },
        3.22
      );

      /* ——— scene 3 · 3.4–5.2 — the two writers, left and right, land on the SAME line;
         their write-bars meet and the second write covers the first ——— */
      tl.fromTo(nova, { x: -430, opacity: 0 }, { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" }, 3.4);
      tl.set(caretA, { opacity: 1 }, 3.74); tl.set(barA, { scaleX: 0 }, 0);
      tl.fromTo(barA, { scaleX: 0 }, { scaleX: 1, duration: 0.52, ease: "none" }, 3.78);
      /* the sliver's right edge lands on bar A's right edge (76.07% of the track, less
         the 0.3cqw sliver) — the same relationship the pixel version held */
      tl.fromTo(caretA, { xPercent: 0 }, { xPercent: 75.44, duration: 0.52, ease: "none" }, 3.78);
      tl.to(nova, { x: 24, duration: 0.52, ease: "power1.inOut" }, 3.78);
      tl.set(caretA, { opacity: 0 }, 4.34);
      tl.fromTo(quill, { x: 430, opacity: 0 }, { x: 0, opacity: 1, duration: 0.46, ease: "power3.out" }, 4.1);
      tl.set(caretB, { opacity: 1 }, 4.4); tl.set(barB, { scaleX: 0 }, 0);
      tl.fromTo(barB, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "none" }, 4.44);
      /* bar B is right-anchored at 66.79% wide, so it starts at the track's right edge
         (less the sliver) and stops with the sliver on bar B's left edge */
      tl.fromTo(caretB, { xPercent: 99.37 }, { xPercent: 32.58, duration: 0.5, ease: "none" }, 4.44);
      tl.to(quill, { x: -24, duration: 0.5, ease: "power1.inOut" }, 4.44);
      tl.fromTo(band, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power2.out" }, 4.56);
      tl.fromTo(barA, { y: -6 }, { y: 0, duration: 0.24, ease: "back.out(2.6)", immediateRender: false }, 4.64);
      tl.set(caretB, { opacity: 0 }, 5.0);

      /* ——— scene 4 · 5.2–7.0 — cue 3; the coral bar sweeps the earlier write blank in
         one beat, then the coral verdict stamp rotates in over the card corner ——— */
      tl.set(sweep, { scaleX: 0 }, 0); tl.fromTo(sweep, { scaleX: 0 }, { scaleX: 1, duration: 0.24, ease: "none" }, 5.22);
      tl.set([barA, barB], { opacity: 0 }, 5.46);
      tl.fromTo(
        sweep,
        { scaleY: 0.82, y: 5 },
        { scaleY: 1, y: 0, duration: 0.16, ease: "back.out(2.4)", immediateRender: false },
        5.46
      );
      tl.fromTo(
        stamp,
        { opacity: 0, scale: 2.2, rotation: -24, y: -26 },
        { opacity: 1, scale: 1, rotation: -6, y: 0, duration: 0.32, ease: "back.out(1.9)" },
        5.42
      );
      tl.fromTo(cue3, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 5.56);
      tl.fromTo(card, { y: 0 }, { y: 9, duration: 0.07, ease: "power2.out", immediateRender: false }, 5.66); tl.fromTo(card, { y: 9 }, { y: 0, duration: 0.44, ease: "elastic.out(1, 0.5)", immediateRender: false }, 5.73);
      tl.to(nova, { opacity: 0.5, duration: 0.32, ease: "power2.out" }, 5.8);

      // full-span anchor so the sub-composition timeline covers the whole slot
      tl.to({}, { duration: 7 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-two-writers"] = tl;
      tl.seek(0);
    })();
