  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var byId = function (id) {
        return document.getElementById(id);
      };

      /* the film's captions — designed in-frame typography, one cue at a time (verbatim) */
      var CAPTIONS = [
        ["f04-cap0", "Wake an agent — this is the whole message."],
        ["f04-cap1", "{ agentId, targetId, seq }"],
        ["f04-cap2a", "A pointer, not the body."],
        ["f04-cap2b", "The agent reads the room itself."]
      ];
      /* the documented wake payload — the whole message that was sent */
      var ROWS = [
        ["f04-line0", '{ agentId: "alice",'],
        ["f04-line1", 'targetId: "parser-fix",'],
        ["f04-line2", "seq: 2 }"]
      ];

      /* caption lines -> word spans (space text nodes keep the measure + wrap points) */
      var caps = CAPTIONS.map(function (entry) {
        var line = byId(entry[0]);
        var words = [];
        entry[1].split(" ").forEach(function (w, j) {
          if (j) line.appendChild(document.createTextNode(" "));
          var s = document.createElement("span");
          s.className = "f04-cw";
          s.textContent = w;
          line.appendChild(s);
          words.push(s);
        });
        return { line: line, words: words };
      });

      /* payload rows -> one span per character (layout stays fixed; only opacity moves) */
      var rows = ROWS.map(function (entry) {
        var box = byId(entry[0]);
        var chars = [];
        for (var k = 0; k < entry[1].length; k++) {
          var s = document.createElement("span");
          s.className = "f04-ch";
          s.textContent = entry[1].charAt(k);
          box.appendChild(s);
          chars.push(s);
        }
        return chars;
      });

      var plate = byId("f04-plateframe");
      var topbar = byId("f04-topbar");
      var kick = byId("f04-kick");
      var kicklead = byId("f04-kicklead");
      var card = byId("f04-card");
      var cardkicker = byId("f04-cardkicker");
      var chip = byId("f04-hintchip");
      var chipfill = byId("f04-chipfill");
      var fills = [byId("f04-fill0"), byId("f04-fill1"), byId("f04-fill2")];
      var cap0 = byId("f04-cap0");
      var cap1 = byId("f04-cap1");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      /* — scene 1 · 0.0–4.0 — the channel plate holds the real capture; cue 1 lands on the beat;
         the wake message row arrives and the mono kicker marks it at the plate's edge — */
      tl.fromTo(plate, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
      tl.fromTo(topbar, { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.05);
      tl.fromTo(
        caps[0].words,
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.34, ease: "power3.out", stagger: 0.06 },
        0.7
      );
      tl.fromTo(kick, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.05);
      tl.fromTo(kicklead, { scaleX: 0 }, { scaleX: 1, duration: 0.22, ease: "power2.out", transformOrigin: "0% 50%" }, 1.12);

      /* — scene 2 · 4.0–7.5 — cue 2: the payload card slides in over the footage; the wide take
         cuts to the pushed-in message column at 5.0 and the three fields tick in one by one — */
      tl.to(cap0, { opacity: 0, y: -12, duration: 0.18, ease: "power2.in" }, 4.08);
      tl.fromTo(
        caps[1].words,
        { y: 16, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out", stagger: 0.05 },
        4.2
      );
      tl.fromTo(card, { opacity: 0, x: 110 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 4.28);
      tl.fromTo(cardkicker, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 4.62);
      tl.to(kick, { opacity: 0, x: -14, duration: 0.28, ease: "power2.in" }, 5.16);
      var ROW_T = [5.2, 5.58, 5.96];
      rows.forEach(function (chars, i) {
        tl.fromTo(
          fills[i],
          { scale: 0 },
          { scale: 1, duration: 0.2, ease: "back.out(2.5)", transformOrigin: "50% 50%" },
          ROW_T[i] - 0.06
        );
        tl.fromTo(chars, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", stagger: 0.01 }, ROW_T[i]);
      });

      /* — scene 3 · 7.5–11.0 — cue 3: the card shrinks, docks beside the message as a hint chip,
         and the frame holds on the real capture — */
      tl.to(cap1, { opacity: 0, y: -12, duration: 0.18, ease: "power2.in" }, 7.48);
      tl.fromTo(
        caps[2].words,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out", stagger: 0.06 },
        7.6
      );
      tl.fromTo(
        caps[3].words,
        { y: 18, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.32, ease: "power3.out", stagger: 0.06 },
        7.72
      );
      tl.to(
        card,
        { x: -21, y: 364, scale: 0.6738, duration: 0.62, ease: "power3.inOut", transformOrigin: "0% 0%" },
        7.8
      );
      tl.set(card, { opacity: 0 }, 8.42);
      tl.fromTo(
        chip,
        { opacity: 0, scale: 1.08 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out", transformOrigin: "50% 50%" },
        8.42
      );
      tl.fromTo(
        chipfill,
        { scale: 0 },
        { scale: 1, duration: 0.18, ease: "back.out(2.5)", transformOrigin: "50% 50%" },
        8.5
      );

      /* full-span anchor: render length 11s */
      tl.to({}, { duration: 11 }, 0);

      window.__timelines["04-wake-is-a-pointer"] = tl;
      tl.seek(0);
    })();
  </script>
