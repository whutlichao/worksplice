<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>DM 私信逻辑原型（throwaway）</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; max-width: 860px; margin: 32px auto; padding: 0 20px; color: #222; }
  h1 { font-size: 22px; } .q { background: #f4f6ff; border-left: 4px solid #4a6cf7; padding: 12px 16px; }
  #state { background: #fafafa; border: 1px solid #ddd; padding: 12px 16px; margin: 16px 0; }
  #state .changed { color: #b35400; font-weight: bold; }
  .btns button { margin: 4px 6px 4px 0; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .tabs { margin-top: 20px; } .tabbar button { padding: 8px 12px; cursor: pointer; }
  .tabbar button.on { background: #4a6cf7; color: #fff; border: none; }
  .tab { border: 1px solid #ddd; padding: 14px 16px; margin-top: 8px; display: none; }
  .tab.on { display: block; }
  .step { display: block; margin: 6px 0; padding: 8px 12px; width: 100%; text-align: left; cursor: pointer; }
  .step.done { background: #e6f7e6; } .log { font-size: 13px; color: #555; margin-top: 8px; white-space: pre-wrap; }
  .badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:12px; background:#eef; }
</style>
</head>
<body>
<h1>DM 私信逻辑原型 <span class="badge">throwaway · 双击即开</span></h1>
<div class="q"><b>要回答的问题：</b>复用 channel 加 <code>type='dm'</code> 的私信模型在「回应判断 / 非法操作拦截 / 幂等补齐」三处是否自洽？<br>
纯逻辑模块 <code>DMRules</code>（decideResponse / canJoinLeave / availableFeatures / seedDMs）与页面壳完全分离，可整体搬入 <code>lib/domain/raft/</code>。</div>

<h2>当前状态</h2>
<div id="state"></div>

<h2>自由点击</h2>
<div class="btns" id="free"></div>

<div class="tabs">
<h2>引导走查</h2>
<div class="tabbar" id="tabbar"></div>
<div id="tabs"></div>
</div>
<div class="log" id="log"></div>

<script>
/* ===== 纯逻辑模块 DMRules（无 DOM，可搬入 lib/domain/raft/） ===== */
const DMRules = {
  // 回应判断：DM 内人类消息 = 确定信号 must-reply；其余沿用频道规则
  decideResponse(ctx) {
    // ctx: { targetType: 'dm'|'public'|'private'|'thread', authorType: 'human'|'agent'|'self', isMentioned, hasInProgressTask }
    if (ctx.authorType === 'self') return 'skip';
    if (ctx.targetType === 'dm' && ctx.authorType === 'human') return 'must-reply';
    if (ctx.isMentioned || ctx.hasInProgressTask) return 'must-reply';
    return 'judge'; // 频道自判
  },
  // 非法操作拦截：DM 禁 join/leave/archive/mute/rename
  canDo(op, targetType) {
    const dmBanned = ['join', 'leave', 'archive', 'mute', 'rename', 'add-member'];
    if (targetType === 'dm' && dmBanned.includes(op)) return { ok: false, reason: 'DM 禁止 ' + op };
    return { ok: true };
  },
  // 功能面
  availableFeatures(targetType) {
    const base = { message: true, quote: true, reaction: true, pin: true, attachment: true, task: true, reminder: true, search: true, unread: true };
    if (targetType === 'dm') return { ...base, mute: false, archive: false, leave: false };
    return { ...base, mute: true, archive: true, leave: true };
  },
  // 幂等补齐：仅缺失才建
  seedDMs(existingNames, agents) {
    const have = new Set(existingNames);
    const created = [];
    for (const a of agents) {
      const name = 'dm:owner↔' + a;
      if (!have.has(name)) { have.add(name); created.push(name); }
    }
    return { created, total: [...have].filter(n => n.startsWith('dm:owner↔')) };
  }
};

/* ===== 页面壳（throwaway） ===== */
const S = { targetType: 'dm', channels: [], lastDecision: '-', lastOp: '-', log: [] };
let prev = '';
function render(changed) {
  const el = document.getElementById('state');
  const rows = [
    ['目标类型', S.targetType], ['DM 列表', JSON.stringify(S.channels)],
    ['最近一次回应判断', S.lastDecision], ['最近一次操作拦截', S.lastOp]
  ];
  el.replaceChildren();
  rows.forEach(([k, v]) => {
    const div = document.createElement('div');
    if (k === changed) { div.className = 'changed'; div.textContent = k + '：' + v + ' ← 刚变'; }
    else div.textContent = k + '：' + v;
    const b = document.createElement('b');
    // 值已进 textContent，加粗仅装饰首行值
    el.appendChild(div);
  });
}
function say(t) { S.log.push(t); document.getElementById('log').textContent = S.log.slice(-12).join('\n'); }
function act(label, fn, changedKey) { say('▶ ' + label); fn(); render(changedKey); }

// 自由点击
const free = [
  ['人类在DM说话→回应判断', () => { S.targetType = 'dm'; S.lastDecision = DMRules.decideResponse({ targetType: 'dm', authorType: 'human' }); }, '最近一次回应判断'],
  ['人类在频道说话→回应判断', () => { S.targetType = 'public'; S.lastDecision = DMRules.decideResponse({ targetType: 'public', authorType: 'human' }); }, '最近一次回应判断'],
  ['被点名→回应判断', () => { S.lastDecision = DMRules.decideResponse({ targetType: 'public', authorType: 'agent', isMentioned: true }); }, '最近一次回应判断'],
  ['DM收mute', () => { const r = DMRules.canDo('mute', 'dm'); S.lastOp = r.ok ? '允许' : '拦截：' + r.reason; }, '最近一次操作拦截'],
  ['DM收archive', () => { const r = DMRules.canDo('archive', 'dm'); S.lastOp = r.ok ? '允许' : '拦截：' + r.reason; }, '最近一次操作拦截'],
  ['DM收加人', () => { const r = DMRules.canDo('add-member', 'dm'); S.lastOp = r.ok ? '允许' : '拦截：' + r.reason; }, '最近一次操作拦截'],
  ['频道收mute（应允许）', () => { const r = DMRules.canDo('mute', 'public'); S.lastOp = r.ok ? '允许' : '拦截：' + r.reason; }, '最近一次操作拦截'],
  ['seed补齐（agents=A,B）', () => { const r = DMRules.seedDMs(S.channels, ['A', 'B']); S.channels = r.total; say('新建：' + JSON.stringify(r.created)); }, 'DM 列表'],
  ['重复seed（应0新建）', () => { const r = DMRules.seedDMs(S.channels, ['A', 'B']); S.channels = r.total; say('新建：' + JSON.stringify(r.created) + '（应为空）'); }, 'DM 列表'],
];
const freeEl = document.getElementById('free');
free.forEach(([label, fn, key]) => {
  const b = document.createElement('button'); b.textContent = label;
  b.onclick = () => act(label, fn, key); freeEl.appendChild(b);
});

// 引导页签
const scenarios = [
  { title: '私信必回应', desc: 'DM 内人类消息是确定信号 must-reply；自己消息 skip。', steps: [
    ['切到 DM', () => { S.targetType = 'dm'; }, '目标类型'],
    ['人类说话 → must-reply', () => { S.lastDecision = DMRules.decideResponse({ targetType: 'dm', authorType: 'human' }); }, '最近一次回应判断'],
    ['自己说话 → skip', () => { S.lastDecision = DMRules.decideResponse({ targetType: 'dm', authorType: 'self' }); }, '最近一次回应判断'],
  ]},
  { title: '频道对照', desc: '频道人类闲聊只是 judge（自判），与 DM 对比。', steps: [
    ['人类在频道闲聊 → judge', () => { S.lastDecision = DMRules.decideResponse({ targetType: 'public', authorType: 'human' }); }, '最近一次回应判断'],
    ['被点名 → must-reply', () => { S.lastDecision = DMRules.decideResponse({ targetType: 'public', authorType: 'agent', isMentioned: true }); }, '最近一次回应判断'],
  ]},
  { title: '非法操作拦截', desc: 'DM 上 mute/archive/加人/改名全部拦截；频道放行。', steps: [
    ['DM+mute → 拦截', () => { S.lastOp = DMRules.canDo('mute', 'dm').reason; }, '最近一次操作拦截'],
    ['DM+archive → 拦截', () => { S.lastOp = DMRules.canDo('archive', 'dm').reason; }, '最近一次操作拦截'],
    ['DM+改名 → 拦截', () => { S.lastOp = DMRules.canDo('rename', 'dm').reason; }, '最近一次操作拦截'],
    ['频道+mute → 允许', () => { S.lastOp = DMRules.canDo('mute', 'public').ok ? '允许' : '拦截'; }, '最近一次操作拦截'],
  ]},
  { title: '幂等补齐', desc: 'seed 两次，第二次 0 新建；新增 agent C 只补 C。', steps: [
    ['seed(A,B)', () => { S.channels = DMRules.seedDMs(S.channels, ['A', 'B']).total; }, 'DM 列表'],
    ['重跑 seed(A,B) → 0新建', () => { const r = DMRules.seedDMs(S.channels, ['A', 'B']); say('新建：' + JSON.stringify(r.created)); }, 'DM 列表'],
    ['新增agent C → 只补C', () => { const r = DMRules.seedDMs(S.channels, ['A', 'B', 'C']); S.channels = r.total; say('新建：' + JSON.stringify(r.created)); }, 'DM 列表'],
  ]},
];
const tabbar = document.getElementById('tabbar'), tabsEl = document.getElementById('tabs');
scenarios.forEach((sc, i) => {
  const tb = document.createElement('button'); tb.textContent = sc.title; if (i === 0) tb.classList.add('on');
  tb.onclick = () => { document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('on')); tb.classList.add('on');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on')); tabsEl.children[i].classList.add('on'); };
  tabbar.appendChild(tb);
  const d = document.createElement('div'); d.className = 'tab' + (i === 0 ? ' on' : '');
  const p = document.createElement('p'); p.textContent = sc.desc; d.appendChild(p);
  sc.steps.forEach(([label, fn, key]) => {
    const b = document.createElement('button'); b.className = 'step'; b.textContent = label;
    b.onclick = () => { act(label, fn, key); b.classList.add('done'); };
    d.appendChild(b);
  });
  tabsEl.appendChild(d);
});
render('');
</script>
</body>
</html>
